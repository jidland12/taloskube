apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: haproxy-ingress
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./manifests/infrastructure/haproxy=ingress/
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: haproxy-ingress